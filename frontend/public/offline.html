<!doctype html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>AMC Portail — Hors connexion</title>
  <style>
    body { margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; box-sizing: border-box; background: linear-gradient(135deg, #213B88 0%, #0088CC 100%); font-family: 'PT Sans', Arial, sans-serif; color: #1f2937; }
    .card { background: #fff; border-radius: 14px; padding: 28px 22px; max-width: 380px; width: 100%; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.15); }
    h1 { font-size: 20px; color: #213B88; margin: 0 0 10px; }
    p { margin: 0 0 20px; color: #64748b; line-height: 1.5; }
    button { background: #213B88; color: #fff; border: none; border-radius: 8px; padding: 12px 22px; font-size: 15px; font-weight: bold; }
  </style>
</head>
<body>
  <!-- Page embarquée dans l'application mobile (Capacitor server.errorPath) : affichée
       quand le portail en ligne ne peut pas être chargé (pas de réseau, serveur en veille). -->
  <div class="card">
    <h1>Connexion impossible</h1>
    <p>Le portail AMC n'a pas pu être chargé. Vérifiez votre connexion Internet puis réessayez.</p>
    <!-- Même URL que server.url dans capacitor.config.json -->
    <button type="button" onclick="window.location.replace('https://amc-portail.onrender.com/')">Réessayer</button>
  </div>
</body>
</html>
